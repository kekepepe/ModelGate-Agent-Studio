services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: modelgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: modelgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelgate -d modelgate"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - modelgate-postgres-data:/var/lib/postgresql/data
    networks:
      - modelgate-net

  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://modelgate:${POSTGRES_PASSWORD}@postgres:5432/modelgate
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  modelgate-postgres-data:
