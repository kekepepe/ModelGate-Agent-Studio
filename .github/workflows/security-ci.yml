name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python lock
        run: |
          python -m pip install pip-audit==2.9.0
          # Framework fixes require Starlette 1.x, while the latest compatible
          # FastAPI release still pins Starlette <0.50. The repository carries
          # tested compensating controls and a VEX record for these exact IDs.
          pip-audit -r backend/requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2132
      - name: Audit frontend lock
        run: npm audit --prefix frontend --audit-level=high
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
