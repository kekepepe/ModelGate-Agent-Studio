name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: modelgate
          POSTGRES_PASSWORD: modelgate-test
          POSTGRES_DB: modelgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelgate -d modelgate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-modelgate.db
      POSTGRES_TEST_URL: postgresql+psycopg://modelgate:modelgate-test@127.0.0.1:5432/modelgate_test
      EXECUTION_MODE: mock
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Static import check
        run: python -m compileall -q src
      - name: Ruff
        run: ruff check src tests scripts
      - name: MyPy core services and schemas
        run: mypy src/services/providers src/services/sandbox_service.py src/schemas
      - name: Backend tests and coverage
        run: pytest -m "not provider and not slow and not e2e" --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=pytest.xml
      - name: PostgreSQL migration and ORM integration
        run: pytest -q tests/test_postgres_integration.py
      - name: Alembic empty and repeat upgrade smoke test
        run: |
          rm -f ci-modelgate.db
          alembic upgrade head
          alembic upgrade head
          python scripts/database_smoke.py
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/pytest.xml
          if-no-files-found: warn
