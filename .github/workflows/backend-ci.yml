name: backend-ci

# V1.2.1 P1 quality-gate baseline. Intentionally NOT wired to push so the
# solo-developer mailbox stays quiet; run it manually from the Actions tab
# (workflow_dispatch) when needed. V1.3 restores on: push after the broader
# CI set lands (see ROADMAP.md + CHANGELOG).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - '.python-version'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check .

      - name: Pytest
        working-directory: backend
        env:
          # CI runs without real provider keys; mock mode is the safe default.
          # Real-provider gates belong in V1.3 P2.
          MODEL_GATE_EXECUTION_MODE: mock
        run: python -m pytest tests/ -q
