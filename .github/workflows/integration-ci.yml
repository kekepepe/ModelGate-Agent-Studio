name: Integration CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/modelgate-integration.db
      EXECUTION_MODE: mock
      WORKSPACE_ROOT: ${{ github.workspace }}
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install pinned Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Start services
        run: |
          python -m uvicorn src.main:app --app-dir backend --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 > frontend.log 2>&1 &
      - name: Wait for API and web
        run: bash scripts/wait-for-services.sh
      - name: API smoke test
        run: bash scripts/api-smoke.sh
      - name: Browser smoke test
        run: npm --prefix frontend run test:e2e
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            backend.log
            frontend.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
