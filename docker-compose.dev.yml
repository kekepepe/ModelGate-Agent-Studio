# 开发模式：修改代码后自动热重载，无需手动重启
# 使用: docker-compose -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: "3.12.8"
    container_name: modelgate-backend-dev
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/app/src          # 挂载源码，uvicorn --reload 检测变更自动重启
      - modelgate-dev-data:/app/data
      - ./:/workspace:rw                # Agent 工具唯一可见的受控工作区
    environment:
      - DATABASE_URL=sqlite:///./data/modelgate.db
      - EXECUTION_MODE=${EXECUTION_MODE:-live}
      - WORKSPACE_ROOT=/workspace
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-local}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-python:3.12.8-slim-bookworm}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - PROVIDER_API_BASE=${PROVIDER_API_BASE:-https://api.openai.com/v1}
      - PROVIDER_API_KEY=${PROVIDER_API_KEY:-}
      - PROVIDER_TIMEOUT_SECONDS=${PROVIDER_TIMEOUT_SECONDS:-60}
      - PLANNER_MODEL_NAME=${PLANNER_MODEL_NAME:-}
      - WORKER_MODEL_NAME=${WORKER_MODEL_NAME:-}
      - VERIFIER_MODEL_NAME=${VERIFIER_MODEL_NAME:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-}
      - APP_NAME=ModelGate Agent Studio
      - DEBUG=true
      - API_V1_PREFIX=/api/v1
    ports:
      - "8000:8000"                     # 开发时暴露后端端口，方便调试 API
    networks:
      - modelgate-dev-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: modelgate-frontend-dev
    volumes:
      - ./frontend/src:/app/src        # 挂载源码，Vite HMR 自动热更新
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"                     # Vite dev server 默认端口
    depends_on:
      - backend
    networks:
      - modelgate-dev-net

volumes:
  modelgate-dev-data:

networks:
  modelgate-dev-net:
    driver: bridge
