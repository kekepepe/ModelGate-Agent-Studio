[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: isolated unit tests without external services",
  "integration: tests spanning API, database, or multiple services",
  "e2e: end-to-end runtime or browser-backed tests",
  "provider: tests that require a real model provider",
  "slow: tests excluded from the default pull-request gate",
  "security: security policy and boundary tests",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/"]
