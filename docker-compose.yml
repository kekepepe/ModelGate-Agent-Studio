services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: "3.12.8"
    container_name: modelgate-backend
    volumes:
      - modelgate-data:/app/data
      - ./:/workspace:rw
    environment:
      - DATABASE_URL=sqlite:///./data/modelgate.db
      - EXECUTION_MODE=${EXECUTION_MODE:-live}
      - MODEL_GATE_EXECUTION_MODE=${MODEL_GATE_EXECUTION_MODE:-live}
      - WORKSPACE_ROOT=/workspace
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-local}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-python:3.12.8-slim-bookworm}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PROVIDER_API_BASE=${PROVIDER_API_BASE:-https://api.openai.com/v1}
      - PROVIDER_API_KEY=${PROVIDER_API_KEY:-}
      - PROVIDER_TIMEOUT_SECONDS=${PROVIDER_TIMEOUT_SECONDS:-60}
      - PLANNER_MODEL_NAME=${PLANNER_MODEL_NAME:-}
      - WORKER_MODEL_NAME=${WORKER_MODEL_NAME:-}
      - VERIFIER_MODEL_NAME=${VERIFIER_MODEL_NAME:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-5242880}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-30}
      - APP_NAME=ModelGate Agent Studio
      - DEBUG=${DEBUG:-false}
      - API_V1_PREFIX=/api/v1
    networks:
      - modelgate-net

  backend-verify:
    profiles: ["verify"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: verify
      args:
        PYTHON_VERSION: "3.12.8"
    environment:
      - DATABASE_URL=sqlite:////tmp/modelgate-verify.db
      - EXECUTION_MODE=mock
      - MODEL_GATE_EXECUTION_MODE=mock
      - WORKSPACE_ROOT=/workspace
      - WORKTREE_ROOT=/tmp/modelgate-worktrees
    volumes:
      - ./:/workspace:rw
    networks:
      - modelgate-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: modelgate-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - modelgate-net

volumes:
  modelgate-data:

networks:
  modelgate-net:
    driver: bridge
