version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modelgate-backend
    volumes:
      - modelgate-data:/app/data
      - ./:/workspace:rw
    environment:
      - DATABASE_URL=sqlite:///./data/modelgate.db
      - EXECUTION_MODE=${EXECUTION_MODE:-live}
      - WORKSPACE_ROOT=/workspace
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-local}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-python:3.12-slim}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - APP_NAME=ModelGate Agent Studio
      - DEBUG=true
      - API_V1_PREFIX=/api/v1
    networks:
      - modelgate-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: modelgate-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - modelgate-net

volumes:
  modelgate-data:

networks:
  modelgate-net:
    driver: bridge
